name: gestaonf

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5173}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      API_PORT: ${API_PORT:-4030}
      NODE_ENV: ${NODE_ENV:-development}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:4030}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      LOCAL_HTTPS_ENABLED: ${LOCAL_HTTPS_ENABLED:-false}
      LOCAL_HTTPS_CERT_FILE: /etc/gestaonf/https/localhost.pem
      LOCAL_HTTPS_KEY_FILE: /etc/gestaonf/https/localhost-key.pem
      LOCAL_HTTPS_CA_FILE: /etc/gestaonf/https/root-ca.pem
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_COMPANY_QUOTA_BYTES: ${R2_COMPANY_QUOTA_BYTES:-1073741824}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_TEST_MODE: ${RESEND_TEST_MODE:-true}
      RESEND_FROM: ${RESEND_FROM:-GestãoNF <onboarding@resend.dev>}
      RESEND_TEST_RECIPIENT: ${RESEND_TEST_RECIPIENT:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_COMPANY_DAILY_LIMIT: ${EMAIL_COMPANY_DAILY_LIMIT:-100}
      EMAIL_PAYLOAD_ENCRYPTION_KEY: ${EMAIL_PAYLOAD_ENCRYPTION_KEY:-}
      EMAIL_PAYLOAD_ENCRYPTION_KEY_ID: ${EMAIL_PAYLOAD_ENCRYPTION_KEY_ID:-v1}
      EMAIL_PAYLOAD_PREVIOUS_KEYS: ${EMAIL_PAYLOAD_PREVIOUS_KEYS:-}
      FISCAL_CERTIFICATE_ENCRYPTION_KEY: ${FISCAL_CERTIFICATE_ENCRYPTION_KEY:-}
      FISCAL_CERTIFICATE_ENCRYPTION_KEY_ID: ${FISCAL_CERTIFICATE_ENCRYPTION_KEY_ID:-v1}
      FISCAL_CERTIFICATE_PREVIOUS_KEYS: ${FISCAL_CERTIFICATE_PREVIOUS_KEYS:-}
      NFSE_HOMOLOGATION_ENABLED: ${NFSE_HOMOLOGATION_ENABLED:-false}
      NFSE_CONTRACT_CONFIRMED: ${NFSE_CONTRACT_CONFIRMED:-false}
      NFSE_SEFIN_HOMOLOGATION_URL: ${NFSE_SEFIN_HOMOLOGATION_URL:-}
      NFSE_SIGNATURE_PROFILE: ${NFSE_SIGNATURE_PROFILE:-}
      NFSE_ICP_BRASIL_CA_BUNDLE: /etc/gestaonf/fiscal/icp-brasil-ca.pem
      ACCOUNTS_ALLOW_LOCAL_ACTIVATION: ${ACCOUNTS_ALLOW_LOCAL_ACTIVATION:-false}
      META_WHATSAPP_ENABLED: ${META_WHATSAPP_ENABLED:-false}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_BUSINESS_PORTFOLIO_ID: ${META_BUSINESS_PORTFOLIO_ID:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WHATSAPP_ACCOUNT_ID: ${META_WHATSAPP_ACCOUNT_ID:-}
      META_DISPLAY_PHONE_NUMBER: ${META_DISPLAY_PHONE_NUMBER:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NERO_BURST_MS: ${NERO_BURST_MS:-2000}
      NERO_CONVERSATION_IDLE_MIN: ${NERO_CONVERSATION_IDLE_MIN:-60}
      NERO_HISTORY_LIMIT: ${NERO_HISTORY_LIMIT:-30}
      NERO_ACTION_TTL_MIN: ${NERO_ACTION_TTL_MIN:-10}
      SUPPORT_AI_ENABLED: ${SUPPORT_AI_ENABLED:-false}
      SUPPORT_AI_MODEL: ${SUPPORT_AI_MODEL:-gpt-6-luna}
      SUPPORT_OPENAI_API_KEY: ${SUPPORT_OPENAI_API_KEY:-}
      SUPPORT_AI_BASE_URL: ${SUPPORT_AI_BASE_URL:-}
      SUPPORT_DAILY_MESSAGE_LIMIT: ${SUPPORT_DAILY_MESSAGE_LIMIT:-100}
      REPORTS_PDF_MAX_ROWS: ${REPORTS_PDF_MAX_ROWS:-5000}
    volumes:
      - ./config/fiscal:/etc/gestaonf/fiscal:ro
      - ./.certs:/etc/gestaonf/https:ro
    ports:
      - "127.0.0.1:${API_PORT:-4030}:${API_PORT:-4030}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["npm", "run", "worker:start"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_COMPANY_QUOTA_BYTES: ${R2_COMPANY_QUOTA_BYTES:-1073741824}
      RESEND_ENABLED: ${RESEND_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_TEST_MODE: ${RESEND_TEST_MODE:-true}
      RESEND_FROM: ${RESEND_FROM:-GestãoNF <onboarding@resend.dev>}
      RESEND_TEST_RECIPIENT: ${RESEND_TEST_RECIPIENT:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_COMPANY_DAILY_LIMIT: ${EMAIL_COMPANY_DAILY_LIMIT:-100}
      EMAIL_PAYLOAD_ENCRYPTION_KEY: ${EMAIL_PAYLOAD_ENCRYPTION_KEY:-}
      EMAIL_PAYLOAD_ENCRYPTION_KEY_ID: ${EMAIL_PAYLOAD_ENCRYPTION_KEY_ID:-v1}
      EMAIL_PAYLOAD_PREVIOUS_KEYS: ${EMAIL_PAYLOAD_PREVIOUS_KEYS:-}
      FISCAL_CERTIFICATE_ENCRYPTION_KEY: ${FISCAL_CERTIFICATE_ENCRYPTION_KEY:-}
      FISCAL_CERTIFICATE_ENCRYPTION_KEY_ID: ${FISCAL_CERTIFICATE_ENCRYPTION_KEY_ID:-v1}
      FISCAL_CERTIFICATE_PREVIOUS_KEYS: ${FISCAL_CERTIFICATE_PREVIOUS_KEYS:-}
      NFSE_HOMOLOGATION_ENABLED: ${NFSE_HOMOLOGATION_ENABLED:-false}
      NFSE_CONTRACT_CONFIRMED: ${NFSE_CONTRACT_CONFIRMED:-false}
      NFSE_SEFIN_HOMOLOGATION_URL: ${NFSE_SEFIN_HOMOLOGATION_URL:-}
      NFSE_SIGNATURE_PROFILE: ${NFSE_SIGNATURE_PROFILE:-}
      NFSE_ICP_BRASIL_CA_BUNDLE: /etc/gestaonf/fiscal/icp-brasil-ca.pem
      ACCOUNTS_ALLOW_LOCAL_ACTIVATION: ${ACCOUNTS_ALLOW_LOCAL_ACTIVATION:-false}
      META_WHATSAPP_ENABLED: ${META_WHATSAPP_ENABLED:-false}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_BUSINESS_PORTFOLIO_ID: ${META_BUSINESS_PORTFOLIO_ID:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WHATSAPP_ACCOUNT_ID: ${META_WHATSAPP_ACCOUNT_ID:-}
      META_DISPLAY_PHONE_NUMBER: ${META_DISPLAY_PHONE_NUMBER:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      NILO_ENABLED: ${NILO_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      NILO_WORKER_CONCURRENCY: ${NILO_WORKER_CONCURRENCY:-4}
      NERO_BURST_MS: ${NERO_BURST_MS:-2000}
      NERO_CONVERSATION_IDLE_MIN: ${NERO_CONVERSATION_IDLE_MIN:-60}
      NERO_HISTORY_LIMIT: ${NERO_HISTORY_LIMIT:-30}
      NERO_ACTION_TTL_MIN: ${NERO_ACTION_TTL_MIN:-10}
      WHATSAPP_SEND_CONCURRENCY: ${WHATSAPP_SEND_CONCURRENCY:-8}
    volumes:
      - ./config/fiscal:/etc/gestaonf/fiscal:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      LOCAL_HTTPS_ENABLED: ${LOCAL_HTTPS_ENABLED:-false}
      LOCAL_HTTPS_CERT_FILE: /etc/gestaonf/https/localhost.pem
      LOCAL_HTTPS_KEY_FILE: /etc/gestaonf/https/localhost-key.pem
    volumes:
      - ./.certs:/etc/gestaonf/https:ro
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
